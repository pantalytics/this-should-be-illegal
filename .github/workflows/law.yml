name: Law changes

# Laws change without a commit here, so check weekly whether any cited article changed
# since the template's `last_checked` date. Opens an issue when one did.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["plugins/*/templates/**", "scripts/check_law.py"]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - id: check
        run: python scripts/check_law.py | tee law-report.txt
      - name: Open issue
        if: failure() && steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          gh issue create \
            --title "Law changed: re-check templates ($(date +%F))" \
            --body "$(printf 'Cited articles changed since the template was last checked. See CONTRIBUTING.md, "When the law changes".\n\n```\n%s\n```' "$(grep -v '^ok' law-report.txt)")"
