# Copyright and license for every file, checked in CI by `reuse lint`.
# When several annotations match a file, the last one wins.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pantalytics and contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pantalytics and contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["plugins/*/skills/**/SKILL.md", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pantalytics and contributors"
SPDX-License-Identifier = "MIT"
